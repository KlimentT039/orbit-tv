# Builds upon detekt's default config (buildUponDefaultConfig = true); only overrides live here.
# Formatting is owned by ktlint, so detekt's formatting rules are not enabled.

config:
  validation: true

complexity:
  LongParameterList:
    # Composables legitimately take many parameters (state, modifier, callbacks).
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    ignoreAnnotatedFunctions: ['Preview', 'PreviewTv']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose convention: top-level constants/CompositionLocals are PascalCase.
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    # Design tokens, dp/sp values and preview data are expressed as literals by design.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview', 'PreviewTv']
    excludes: ['**/test/**', '**/androidTest/**', '**/*Test.kt', '**/designsystem/**/theme/**', '**/designsystem/**/icon/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewTv']
  ForbiddenComment:
    active: false
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    max: 3
  WildcardImport:
    active: true
